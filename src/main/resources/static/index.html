<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glass Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Auth Section -->
    <div id="auth-section" class="glass-container active">
        <h1 id="login-title">Welcome Back</h1>
        <p id="login-subtitle">Log in to access your 3D Journal.</p>
        
        <div class="role-toggle-container">
            <span class="role-label active" id="label-user">User</span>
            <label class="switch">
                <input type="checkbox" id="role-toggle">
                <span class="slider round"></span>
            </label>
            <span class="role-label" id="label-admin">Admin</span>
        </div>

        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="glow-button">Log In</button>
        </form>
        <div id="auth-error" class="error-msg"></div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="dashboard-container">
        <header class="glass-header">
            <h2>My Journal</h2>
            <div class="header-actions">
                <input type="text" id="search-input" placeholder="Search entries...">
                <button id="btn-new-entry" class="glow-button small">New Entry</button>
                <button id="btn-profile" class="ghost-button small" style="color: #ff4d4f; border-color: rgba(255, 77, 79, 0.3);">Delete Account</button>
                <button id="btn-logout" class="ghost-button small">Logout</button>
            </div>
        </header>

        <div id="journal-grid" class="journal-grid">
            <!-- Journal cards will be injected here by app.js -->
        </div>

        <div class="pagination">
            <button id="btn-prev" class="ghost-button small" disabled>Prev</button>
            <span id="page-info">Page 1</span>
            <button id="btn-next" class="ghost-button small" disabled>Next</button>
        </div>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="admin-dashboard-section" class="dashboard-container">
        <header class="glass-header">
            <h2>Admin Dashboard</h2>
            <div class="header-actions">
                <button id="btn-admin-logout" class="ghost-button small">Logout</button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Users List -->
            <div class="glass-container admin-panel">
                <h3>User Management</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-list">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Audit Logs -->
            <div class="glass-container admin-panel">
                <h3>Audit History</h3>
                <div class="audit-feed" id="admin-audit-logs">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- New Entry Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="glass-container modal-content">
            <h2>Journal Entry</h2>
            <form id="entry-form">
                <input type="text" id="entry-title" placeholder="Title" required>
                <textarea id="entry-content" rows="5" placeholder="Write your thoughts..." required></textarea>
                <input type="text" id="entry-tags" placeholder="Tags (comma separated)">
                <div class="modal-actions">
                    <button type="button" id="btn-cancel" class="ghost-button">Cancel</button>
                    <button type="submit" class="glow-button">Save</button>
                </div>
            </form>
            <div id="entry-error" class="error-msg"></div>
        </div>
    </div>

    <!-- Delete Account Modal -->
    <div id="profile-modal-overlay" class="modal-overlay">
        <div class="glass-container modal-content">
            <h2>Delete Account</h2>
            <p style="color: #c9d1d9;">Are you sure you want to delete your account? This will permanently delete all your journals.</p>
            <form id="profile-form">
                <div class="modal-actions">
                    <button type="button" id="btn-profile-cancel" class="ghost-button">Cancel</button>
                    <button type="submit" class="glow-button" style="background: linear-gradient(90deg, #ff4d4f, #d9363e);">Delete My Account</button>
                </div>
            </form>
            <div id="profile-error" class="error-msg"></div>
            <div id="profile-success" style="color: #3fb950; margin-top: 1rem; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
